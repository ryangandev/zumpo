name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run in flight for it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # One linter for the whole repo. oxlint rather than ESLint because
      # typescript-eslint still caps TypeScript below 7; see
      # docs/architecture.md#tooling.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Checked rather than trusted: without this, the config is only a
      # suggestion and the style drifts back apart one editor at a time.
      - name: Format
        run: npm run format:check

      # The code tokens are generated from the Figma export; this fails when
      # one was edited by hand or the export changed without regenerating.
      - name: Design tokens
        run: npm run design:tokens -- --check

      # The sounds are built from masters outside the repository, where
      # ffmpeg is; this checks, without either, that the generated files
      # match audio/sounds.json and that every sound has an allowed licence.
      - name: Sounds
        run: npm run audio:check

      # The server suite binds ephemeral ports and drives real socket.io
      # clients, so it needs no services, but it is timing-sensitive, and a
      # loaded runner is exactly where that shows up.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Two players in real browsers against the production build: the flows the
  # unit suites stub out, like a dropped connection or a whole game.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser checks
        run: npm run e2e

      - name: Keep the traces of failed checks
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: test-results/
